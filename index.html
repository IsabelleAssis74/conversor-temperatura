<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Conversor de Temperatura</h1>

    <label for="valor">Valor:</label>
    <input type="number" id="valor" placeholder="Ex.: 25">

    <label for="tipo">Converter:</label>
    <select id="tipo">
      <option value="c-f">Celsius para Fahrenheit</option>
      <option value="f-c">Fahrenheit para Celsius</option>
      <option value="c-k">Celsius para Kelvin</option>
    </select>

    <button id="botao">Converter</button>
    <p id="resultado"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
